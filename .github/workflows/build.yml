name: Build

on:
  push:
    branches: [main, master]
  workflow_dispatch: # 允许手动触发

jobs:
  # ── 单包构建 Windows ──────────────────────────────────
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm ci

      # 签名在构建时完成：配置了 pubkey + createUpdaterArtifacts 后，
      # tauri 会在打包阶段直接签名并产出 .sig，拿不到私钥就直接构建失败
      # （实测：A public key has been found, but no private key）。
      # 故私钥必须在此可用，不能挪到构建之后再补签。
      - name: Build Windows
        run: npm run tauri build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          # 必须显式给空串。密钥无密码时若该变量未定义，CLI 会尝试交互式
          # 读取密码，在无 tty 的 CI 里报 os error 6 导致构建失败（已实测）。
          # 用 || '' 兜底，避免依赖「必须存在一个空值 secret」这种易漏配置
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || '' }}

      - name: List bundle output
        shell: powershell
        run: |
          if (Test-Path "src-tauri/target/release/bundle") {
            Get-ChildItem -Recurse "src-tauri/target/release/bundle" | Select-Object FullName
          } else {
            Write-Host "bundle directory not found"
          }

      # 收集已签名的安装包与签名文件，供服务器发布脚本取用
      - name: Collect signed installer
        shell: bash
        run: |
          mkdir -p dist-updater
          cp src-tauri/target/release/bundle/nsis/*-setup.exe dist-updater/
          cp src-tauri/target/release/bundle/nsis/*-setup.exe.sig dist-updater/

      - name: Upload updater artifacts
        uses: actions/upload-artifact@v4
        with:
          name: updater-release
          path: dist-updater/*
          if-no-files-found: error
          retention-days: 30

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 30

  # ── 单包构建 macOS ────────────────────────────────────
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm ci

      - name: Build macOS
        run: npm run tauri build
        env:
          # 同 Windows：配了 pubkey 后构建阶段就要签名，缺私钥直接失败；
          # 密码变量未定义会触发交互式读取，故显式给空串兜底
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || '' }}

      - name: List bundle output
        run: find src-tauri/target/release/bundle -type f 2>/dev/null || echo "bundle dir not found"

      - name: Zip .app for upload
        run: |
          cd src-tauri/target/release/bundle/macos
          zip -r "aichat-Updater-macOS.zip" *.app

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-build
          path: |
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/macos/*.zip
          if-no-files-found: error
          retention-days: 30

